[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-work-harness"
version = "0.1.0"
description = "Local, evidence-bound agent work and review controller"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3"]

[project.scripts]
work-harness = "harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["harness/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["harness/vendor"]
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["harness.vendor.*"]
ignore_errors = true
